name: Import and sync OpenWA source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-openwa-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openwa-source-sync
  cancel-in-progress: false

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WablastXl
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import upstream OpenWA source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wablastxl-overlay
          for file in README.md railway.json .env.wablastxl.example UPSTREAM-LICENSE.md .dockerignore .gitignore; do
            if [ -f "$file" ]; then cp "$file" "/tmp/wablastxl-overlay/$file"; fi
          done

          git clone --depth 1 --branch main https://github.com/rmyndharis/OpenWA.git /tmp/openwa
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/openwa/ ./

          # Fail closed if the import is incomplete or the upstream layout changes.
          test -s package.json
          test -s package-lock.json
          test -s Dockerfile
          test -s src/main.ts
          test -s dashboard/package.json
          test -s LICENSE
          node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.build || !p.scripts.test) process.exit(1); console.log('Imported OpenWA version:', p.version || 'unspecified')"

          printf '\n\n## Imported upstream revision\n\n- Upstream repository: https://github.com/rmyndharis/OpenWA\n- Imported commit: %s\n' "$(git -C /tmp/openwa rev-parse HEAD)" >> /tmp/wablastxl-overlay/UPSTREAM-LICENSE.md

          for file in README.md railway.json .env.example UPSTREAM-LICENSE.md .dockerignore .gitignore; do
            if [ -f "/tmp/wablastxl-overlay/$file" ]; then cp "/tmp/wablastxl-overlay/$file" "$file"; fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to import."
          else
            git commit -m "chore: import upstream OpenWA source"
            git push origin HEAD:main
          fi
